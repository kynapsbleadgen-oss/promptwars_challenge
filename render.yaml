services:
  - type: web
    name: wayfare-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: CORS_ORIGIN
        value: "https://promptwars-challenge-three.vercel.app,http://localhost:5173"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # ── Secrets: paste these values in the Render Dashboard ──────────────
      # Environment → Add Environment Variable
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
